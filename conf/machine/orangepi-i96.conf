#@TYPE: Machine
#@NAME: OrangePi i96
#@DESCRIPTION: OrangePi i96 — RDA8810PL (Cortex-A5), 96Boards IE form factor
#
# This machine definition replaces the one in the abandoned meta-96boards layer.
# That layer's version targeted the vendor's Linux 3.10 tree and its 2012 u-boot,
# neither of which builds with a current toolchain. Here the board is built
# against mainline: linux-yocto 6.6 plus the RDA patch series in
# recipes-kernel/linux/, and a u-boot 2024.01 stage-2 loaded by the vendor SPL.
#
# Board bring-up notes, including everything that does NOT work and why, are in
# recipes-kernel/linux/files/MODEM-WIFI-PORT.md.

require conf/machine/include/arm/armv7a/tune-cortexa5.inc

MACHINE_FEATURES = "usbhost usbgadget alsa wifi ext2"

# Kernel: mainline linux-yocto, not the vendor 3.10 tree. The RDA8810PL support
# (clk/reset, IFC dmaengine, rda-mmc, i2c, combo power, rdawlan) is carried as
# the rda-mmc-* series in recipes-kernel/linux/files/ — see linux-yocto_%.bbappend.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.6%"
KERNEL_IMAGETYPE = "zImage"
# Machine-wide, not in the kernel bbappend: image recipes read it too (the
# pantavisor BSP packs these dtbs into the trail for the boot script to load).
KERNEL_DEVICETREE = "unisoc/rda8810pl-orangepi-i96.dtb"

# Bootloader: hybrid. The vendor SPL does DDR/clock init (frozen firmware, built
# signature-off by files/build-rda8810-spl.sh) and loads a modern u-boot stage-2
# that has the FIT/setexpr/env features a pantavisor boot script needs.
# The bootable blob is SPL + stage-2 assembled by files/package-bootloader.sh.
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-orangepi-i96"
PREFERRED_VERSION_u-boot-orangepi-i96 ?= "2024.01"
UBOOT_MACHINE = "rda8810pl_orangepi_i96_defconfig"
# Our stage-2 produces a plain u-boot.bin; the vendor-packaged ".rda" output of
# the old recipe is assembled out-of-band instead.
UBOOT_SUFFIX = "bin"
EXTRA_IMAGEDEPENDS = "u-boot-orangepi-i96"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "u-boot-orangepi-i96"

# 921600 is not a preference: the BootROM prints at this rate on this pin, so
# the console has to match it to stay readable across the whole boot.
SERIAL_CONSOLES = "921600;ttyS0"
CMDLINE_ROOT = "mmcblk0p2"
CMDLINE ?= "console=ttyS0,921600 root=/dev/${CMDLINE_ROOT} rootwait rw"

IMAGE_FSTYPES:append = " ext4.gz"
IMAGE_ROOTFS_ALIGNMENT = "4096"
EXTRA_IMAGECMD:ext4 += " -L rootfs "

WKS_FILE ?= "orangepi-i96.wks"
