# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "orangepi-i96"
BBFILE_PATTERN_orangepi-i96 = "^${LAYERDIR}/"
BBFILE_PRIORITY_orangepi-i96 = "10"

LAYERDEPENDS_orangepi-i96 = "core"
LAYERSERIES_COMPAT_orangepi-i96 = "scarthgap"
