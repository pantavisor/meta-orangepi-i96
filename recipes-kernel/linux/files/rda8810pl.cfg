# Enable RDA Micro RDA8810PL SoC (OrangePi i96) on top of multi_v7_defconfig.
# ARCH_RDA selects RDA_INTC + RDA_TIMER; the UART is the boot console.
CONFIG_ARCH_RDA=y
CONFIG_SERIAL_RDA=y
CONFIG_SERIAL_RDA_CONSOLE=y
CONFIG_GPIO_RDA=y
# SD/MMC storage (backported RDA8810PL series): clock/reset + IFC DMA + MMC host
CONFIG_CLK_RDA8810=y
CONFIG_DMADEVICES=y
CONFIG_RDA_IFC=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_RDA=y
# WiFi stage 1: I2C (RDA599x combo control interface)
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_RDA=y
# WiFi stage 2: combo chip power controller
CONFIG_RDA_COMBO=y
# WiFi stage 3: modem msys client (v_bt supply + 26M/32k clocks for the
# combo chip's SDIO core; the modem must be started by the bootloader)
CONFIG_RDA_MDSYS=y
# Debug configs removed after the mmc bring-up (they served their purpose:
# lockdep + DEBUG_ATOMIC_SLEEP caught the rda-mmc sleep-under-spinlock
# deadlock, fixed in rda-mmc-14). Note lockdep changes struct module size,
# so kernel and modules must always be built together.
# Bring-up aid: per-command visibility on the bench. rda-mmc has dev_dbg at
# every command send/response; enable them at runtime with
#   echo 'file drivers/mmc/* +p' > /sys/kernel/debug/dynamic_debug/control
CONFIG_DYNAMIC_DEBUG=y
# Allow booting with the DTB concatenated onto the zImage. The vendor u-boot
# (2012.04, shipped for a 3.10 ATAG kernel) has no libfdt and cannot pass a
# device tree, so it is the only way to boot this kernel from that bootloader --
# which is needed to test whether starting the modem coprocessor (mdcom_loadm,
# a command only the vendor u-boot has) brings the WiFi SDIO up. ATAG_DTB_COMPAT
# lets that bootloader's ATAG cmdline reach the kernel. Both are inert when a
# proper DTB is passed, so they cost nothing on our own bootloader.
CONFIG_ARM_APPENDED_DTB=y
CONFIG_ARM_ATAG_DTB_COMPAT=y
# WiFi stage 4: the rdawlan cfg80211 driver (SDIO data path -> wlan0)
CONFIG_CFG80211=y
CONFIG_RDAWFMAC=y
# Machine restart and power-off via the always-on MD system controller.
# Without this the SoC has no restart handler at all: the vendor resets it
# from the modem coprocessor, which mainline never starts, so reboot(2) just
# halts the CPU and the board needs a physical power cycle. This also makes
# the panic= on the pantavisor cmdline effective.
CONFIG_POWER_RESET=y
CONFIG_POWER_RESET_RDA8810PL=y
# Bluetooth (stage 5): BLE provisioning via pvwificonnect's Improv server.
# The RDA5991 combo chip's BT half speaks HCI over a UART -- the vendor kernel
# uses the stock hci_uart driver with the H4 protocol and ships no RDA-specific
# Bluetooth code, so nothing needs porting here beyond turning it on.
# BlueZ is already present and running in the alpine-connman container; it
# simply has no adapter to claim until this exists.
# See MODEM-WIFI-PORT.md section 29 for the UART identification.
CONFIG_BT=y
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_HCIUART_H4=y
# RFCOMM/BNEP/HIDP mirror the vendor config. Not needed for BLE provisioning,
# but they are what a general-purpose BT stack is expected to offer and cost
# little; drop them if size ever matters.
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y
